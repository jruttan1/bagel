[project]
name = "bagel-backend"
version = "0.1.0"
description = "Bagel personal investment intelligence agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=1.99,<3",
  "phonenumbers>=9,<10",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
  "ws-api==0.35.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
